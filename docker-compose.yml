services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aboutmesite-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      LOG_TO_CONSOLE: "true"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./rag_source:/app/rag_source:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.aboutme.rule=Host(`aboutme.dimonrond.ru`)"
      - "traefik.http.routers.aboutme.entrypoints=websecure"
      - "traefik.http.routers.aboutme.tls=true"
      - "traefik.http.routers.aboutme.tls.certresolver=mytlschallenge"
      - "traefik.http.services.aboutme.loadbalancer.server.port=5000"

networks:
  n8n_default:
    external: true
